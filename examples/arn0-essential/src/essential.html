<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Arn0 Launcher</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#090b10;color:#f4f5f7;font-family:"SamsungOne",Arial,sans-serif;cursor:none}
#home{padding:86px 120px;width:1920px;height:1080px}header{height:182px;display:flex;justify-content:space-between;align-items:flex-start}h1{font-size:42px;font-weight:400;margin:0}#clock{font-size:64px;line-height:1}
h2{font-size:24px;letter-spacing:3px;font-weight:400;color:#9ba4b3;margin:0 0 28px}.row{display:flex;margin-bottom:88px}.tile{position:relative;flex:none;width:210px;height:208px;margin:0 28px 0 0;border:3px solid transparent;border-radius:16px;color:#fff;font:inherit;padding:22px 12px;background:#17202e;outline:none}
#apps-row .tile{flex:1 1 0;min-width:0;max-width:210px}#apps-row .tile:last-child{margin-right:0}.tile.focus{border-color:#fff}.mark{display:block;font-size:56px;line-height:92px}.label{display:block;font-size:25px;line-height:32px}.logo{position:absolute;top:24px;left:50%;margin-left:-69px;width:138px;height:86px;object-fit:contain}#inputs-row .tile{width:272px;height:148px}#inputs-row .mark{font-size:30px;line-height:45px}#status{height:40px;font-size:25px;color:#aeb8c7}.hint{font-size:22px;color:#929baa}
</style>
</head>
<body><main id="home"><header><h1>Home</h1><time id="clock"></time></header><h2>APP</h2><div id="apps-row" class="row"></div><h2>INGRESSI</h2><div id="inputs-row" class="row"></div><div id="status" role="status"></div><div class="hint">Frecce per scegliere · OK per aprire</div></main><script src="js/essential.bundle.js"></script></body>
</html>
